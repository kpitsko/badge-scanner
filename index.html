<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>Badge Scanner — CAI National 2026</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0f172a; color: #e2e8f0;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); max-width: 560px; margin: 0 auto; }
  header { padding: 16px 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .hint { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
  button { -webkit-appearance: none; appearance: none; border: 0; background: #2563eb; color: white;
    padding: 14px 18px; border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%;
    cursor: pointer; font-family: inherit; }
  button.secondary { background: #334155; }
  button.ghost { background: transparent; color: #94a3b8; padding: 8px; width: auto; font-size: 14px; font-weight: 500; }
  button.small { width: auto; padding: 10px 14px; font-size: 14px; font-weight: 500; flex-shrink: 0; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .scan-btn { padding: 22px; font-size: 18px; margin: 8px 0 16px; }
  #preview { width: 100%; border-radius: 12px; margin: 8px 0; max-height: 220px; object-fit: contain; background: #1e293b; }
  .progress { background: #1e293b; padding: 12px; border-radius: 8px; margin: 8px 0; font-size: 14px; color: #94a3b8; display: flex; align-items: center; gap: 10px; }
  .spinner { width: 16px; height: 16px; border: 2px solid #334155; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .field { margin: 10px 0; }
  .field label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
  .field .row { display: flex; gap: 8px; }
  .field input { flex: 1; min-width: 0; padding: 12px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0; font-size: 16px; font-family: inherit; }
  .field input:focus { outline: 2px solid #2563eb; border-color: transparent; }
  .copied { background: #16a34a !important; }
  .actions { display: grid; gap: 8px; margin: 16px 0 40px; }
  .hidden { display: none !important; }
  .err { background: #7f1d1d; color: #fee2e2; padding: 12px; border-radius: 8px; margin: 8px 0; font-size: 14px; word-break: break-word; }
  .settings { background: #1e293b; padding: 16px; border-radius: 12px; margin: 8px 0 16px; border: 1px solid #334155; }
  .settings h2 { margin: 0 0 4px; font-size: 15px; }
  .settings p { color: #94a3b8; font-size: 13px; margin: 0 0 10px; }
  .settings input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #e2e8f0; font-size: 14px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .settings input:focus { outline: 2px solid #2563eb; border-color: transparent; }
  .settings-row { display: flex; gap: 8px; margin-top: 8px; }
  .settings-row button { flex: 1; }
</style>
</head>
<body>
  <header>
    <h1>Badge Scanner</h1>
    <button class="ghost" id="settingsBtn" aria-label="Settings">⚙ Settings</button>
  </header>
  <div class="hint">Point your camera at a badge. Claude reads it; tap Copy and paste into the form.</div>

  <div id="settings" class="settings hidden">
    <h2>OCR worker URL</h2>
    <p>Paste your Cloudflare Worker URL (saved on this device only).</p>
    <input id="workerUrlInput" type="url" placeholder="https://badge-scanner-ocr.your-account.workers.dev" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
    <div class="settings-row">
      <button id="saveSettings">Save</button>
      <button id="cancelSettings" class="secondary">Cancel</button>
    </div>
  </div>

  <button id="scanBtn" class="scan-btn">📷 Scan a badge</button>
  <input id="fileIn" type="file" accept="image/*" hidden>

  <img id="preview" class="hidden" alt="Captured badge">

  <div id="progress" class="progress hidden">
    <div class="spinner"></div>
    <div id="progressLabel">Reading badge…</div>
  </div>

  <div id="errorBox" class="err hidden"></div>

  <div id="fields" class="hidden">
    <div class="field"><label>First name</label><div class="row"><input id="firstName" autocomplete="off" autocapitalize="words" spellcheck="false"><button class="small secondary" data-copy="firstName">Copy</button></div></div>
    <div class="field"><label>Last name</label><div class="row"><input id="lastName" autocomplete="off" autocapitalize="words" spellcheck="false"><button class="small secondary" data-copy="lastName">Copy</button></div></div>
    <div class="field"><label>Email</label><div class="row"><input id="email" type="email" autocomplete="off" autocapitalize="off" inputmode="email" spellcheck="false"><button class="small secondary" data-copy="email">Copy</button></div></div>
    <div class="field"><label>Company</label><div class="row"><input id="company" autocomplete="off" autocapitalize="words" spellcheck="false"><button class="small secondary" data-copy="company">Copy</button></div></div>
    <div class="field"><label>Job title</label><div class="row"><input id="title" autocomplete="off" autocapitalize="words" spellcheck="false"><button class="small secondary" data-copy="title">Copy</button></div></div>

    <div class="actions">
      <button id="openForm">Open techcollect form ↗</button>
      <button id="reset" class="secondary">Scan another</button>
    </div>
  </div>

<script>
const FORM_URL = 'https://techcollect.ai/cai-national-2026/';
const STORAGE_KEY = 'badge-scanner.workerUrl';
// Built-in OCR worker — the app works out of the box, no setup. Settings can override it.
const DEFAULT_WORKER_URL = 'https://badge-scanner-ocr.kim-pitsko.workers.dev';
const FIELD_IDS = ['firstName','lastName','email','company','title'];
const $ = (id) => document.getElementById(id);

const scanBtn = $('scanBtn');
const fileIn  = $('fileIn');
const preview = $('preview');
const progress = $('progress');
const progLabel = $('progressLabel');
const fields = $('fields');
const errorBox = $('errorBox');
const settingsPanel = $('settings');
const workerUrlInput = $('workerUrlInput');

function getWorkerUrl() {
  return localStorage.getItem(STORAGE_KEY) || DEFAULT_WORKER_URL;
}
function setWorkerUrl(url) {
  if (url) localStorage.setItem(STORAGE_KEY, url);
  else localStorage.removeItem(STORAGE_KEY);
}

$('settingsBtn').addEventListener('click', () => {
  workerUrlInput.value = getWorkerUrl();
  settingsPanel.classList.toggle('hidden');
});
$('saveSettings').addEventListener('click', () => {
  let url = workerUrlInput.value.trim();
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  setWorkerUrl(url);
  settingsPanel.classList.add('hidden');
  hideError();
});
$('cancelSettings').addEventListener('click', () => {
  settingsPanel.classList.add('hidden');
});

scanBtn.addEventListener('click', () => {
  if (!getWorkerUrl()) {
    showError('Set the OCR worker URL in Settings first.');
    workerUrlInput.value = '';
    settingsPanel.classList.remove('hidden');
    workerUrlInput.focus();
    return;
  }
  fileIn.click();
});

$('reset').addEventListener('click', resetUi);
$('openForm').addEventListener('click', () => window.open(FORM_URL, '_blank', 'noopener'));

document.querySelectorAll('button[data-copy]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const id = btn.dataset.copy;
    const val = $(id).value;
    const ok = await copyToClipboard(val);
    const original = btn.textContent;
    btn.textContent = ok ? '✓ Copied' : 'Select & copy';
    btn.classList.toggle('copied', ok);
    if (!ok) { $(id).focus(); $(id).select(); }
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1100);
  });
});

async function copyToClipboard(text) {
  if (!text) return false;
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.body.removeChild(ta);
  return ok;
}

function resetUi() {
  fields.classList.add('hidden');
  preview.classList.add('hidden');
  preview.removeAttribute('src');
  hideError();
  FIELD_IDS.forEach(id => $(id).value = '');
  fileIn.value = '';
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.remove('hidden');
}
function hideError() {
  errorBox.classList.add('hidden');
  errorBox.textContent = '';
}

fileIn.addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  hideError();
  fields.classList.add('hidden');
  progress.classList.remove('hidden');
  progLabel.textContent = 'Preparing image…';

  try {
    const { base64, dataUrl } = await compressImage(file);
    preview.src = dataUrl;
    preview.classList.remove('hidden');

    progLabel.textContent = 'Reading badge with Claude…';
    const data = await callOcrWorker(base64);

    FIELD_IDS.forEach(id => $(id).value = data[id] ?? '');
    progress.classList.add('hidden');
    fields.classList.remove('hidden');
  } catch (err) {
    progress.classList.add('hidden');
    showError(err?.message || String(err));
  }
});

async function compressImage(file, maxDim = 2000, quality = 0.92) {
  // Decode the photo. createImageBitmap is the reliable path on phones: it
  // decodes large (12MP+) images off the main thread and honors EXIF
  // orientation, avoiding the rotation/blank-canvas bugs that the older
  // <img>+canvas path hits on iOS Safari. Fall back if it's unavailable.
  let source, srcW, srcH;
  try {
    source = await createImageBitmap(file, { imageOrientation: 'from-image' });
    srcW = source.width;
    srcH = source.height;
  } catch {
    const dataUrlRaw = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('Could not read photo file'));
      reader.readAsDataURL(file);
    });
    source = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error('Could not decode photo'));
      im.src = dataUrlRaw;
    });
    srcW = source.naturalWidth;
    srcH = source.naturalHeight;
  }

  if (!srcW || !srcH) throw new Error('Photo had no readable image data. Try a different photo.');

  const ratio = Math.min(maxDim / srcW, maxDim / srcH, 1);
  const w = Math.max(1, Math.round(srcW * ratio));
  const h = Math.max(1, Math.round(srcH * ratio));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(source, 0, 0, w, h);
  if (source.close) source.close();

  const dataUrl = canvas.toDataURL('image/jpeg', quality);
  const base64 = dataUrl.split(',')[1] || '';
  if (base64.length < 1000) throw new Error('Image processing failed on this device. Try a smaller photo.');
  return { base64, dataUrl };
}

async function callOcrWorker(base64) {
  const url = getWorkerUrl();
  if (!url) throw new Error('No OCR worker URL set. Open Settings.');

  let resp;
  try {
    resp = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ image: base64, mediaType: 'image/jpeg' }),
    });
  } catch (e) {
    throw new Error('Could not reach OCR worker. Check the URL in Settings and your network.');
  }

  let payload;
  try {
    payload = await resp.json();
  } catch {
    throw new Error(`OCR worker returned non-JSON (HTTP ${resp.status}).`);
  }

  if (!resp.ok || payload.error) {
    throw new Error(payload.error || `OCR worker error (HTTP ${resp.status}).`);
  }
  return payload;
}
</script>
</body>
</html>
